<!DOCTYPE html>
<html lang="id">
<head>
    <script>
    if (sessionStorage.getItem("petualanganHurufSplashSeen") === "true") {
      document.documentElement.classList.add("splash-already-seen");
    }
  </script>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Petualangan Huruf</title>

    

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
     
</head>

<body>

    <!-- =====================================================
         GAME CONTAINER
    ====================================================== -->

    <main class="game-screen">

        <!-- Background decorations -->
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        <div class="cloud cloud-3"></div>

        <div class="butterfly butterfly-1">🦋</div>
        <div class="butterfly butterfly-2">🦋</div>

        <!-- =================================================
             TOP BAR
        ================================================== -->

        <header class="top-bar">

            <button
                class="icon-button"
                id="soundButton"
                aria-label="Suara"
            >
                <span id="soundIcon">🔊</span>
            </button>

            <div class="game-badge">
                <span class="badge-star">⭐</span>
                <span id="starCount">0</span>
            </div>

            <button
                class="icon-button"
                id="settingsButton"
                aria-label="Pengaturan"
            >
                ⚙️
            </button>

        </header>


        <!-- =================================================
             MAIN CONTENT
        ================================================== -->

        <section class="home-content">

            <!-- LOGO / TITLE -->

            <div class="game-title">

                <div class="title-small">
                    YUK BELAJAR SAMBIL BERMAIN
                </div>

                <h1>
                    <span class="title-blue">PETUALANGAN</span>
                    <span class="title-orange">HURUF</span>
                </h1>

                <div class="title-stars">
                    <span>⭐</span>
                    <span>✨</span>
                    <span>⭐</span>
                </div>

            </div>

        <!-- HERO ROW: KIKO + MENU -->
        <div class="hero-row">
            <!-- KIKO -->

            <div class="kiko-container">

                <div class="kiko-sparkle sparkle-1">✨</div>
                <div class="kiko-sparkle sparkle-2">⭐</div>

                <img
                    src="assets/character/kiko-hello.png"
                    alt="Kiko"
                    class="kiko"
                    id="kiko"
                >

                <div class="hello-bubble">
                    <span>Halo! 👋</span>
                    <small>Yuk bermain!</small>
                </div>

            </div>


            <!-- MENU GAME -->

            <div class="game-menu">

                <!-- MENGENAL HURUF -->

                <button
                    class="game-card card-blue"
                    data-game="mengenal"
                >

                    <div class="card-icon">

                        <img
                            src="assets/icons/mengenal.jpg"
                            alt="Mengenal Huruf"
                        >

                    </div>

                    <div class="card-text">

                        <span class="card-title">
                            MENGENAL
                        </span>

                        <span class="card-subtitle">
                            HURUF
                        </span>

                    </div>

                    <div class="card-arrow">
                        <img src="assets/button/play.png" alt="Main" class="card-arrow-img">
                    </div>

                </button>


                <!-- TEBAK HURUF -->

                <button
                    class="game-card card-orange"
                    data-game="tebak"
                >

                    <div class="card-icon">

                        <img
                            src="assets/icons/tebak.jpg"
                            alt="Tebak Huruf"
                        >

                    </div>

                    <div class="card-text">

                        <span class="card-title">
                            TEBAK
                        </span>

                        <span class="card-subtitle">
                            HURUF
                        </span>

                    </div>

                     <div class="card-arrow">
                        <img src="assets/button/play.png" alt="Main" class="card-arrow-img">
                    </div>

                </button>


                <!-- MENULIS HURUF -->

                <button
                    class="game-card card-green"
                    data-game="menulis"
                >

                    <div class="card-icon">

                        <img
                            src="assets/icons/menulis.jpg"
                            alt="Menulis Huruf"
                        >

                    </div>

                    <div class="card-text">

                        <span class="card-title">
                            MENULIS
                        </span>

                        <span class="card-subtitle">
                            HURUF
                        </span>

                    </div>

                     <div class="card-arrow">
                        <img src="assets/button/play.png" alt="Main" class="card-arrow-img">
                    </div>

                </button>


                <!-- PASANG HURUF -->

                <button
                    class="game-card card-purple"
                    data-game="pasang"
                >

                    <div class="card-icon">

                        <img
                            src="assets/icons/pasang.jpg"
                            alt="Pasang Huruf"
                        >

                    </div>

                    <div class="card-text">

                        <span class="card-title">
                            PASANG
                        </span>

                        <span class="card-subtitle">
                            HURUF
                        </span>

                    </div>

                     <div class="card-arrow">
                        <img src="assets/button/play.png" alt="Main" class="card-arrow-img">
                    </div>

                </button>

            </div>
            </div>

        </section>


        <!-- =================================================
             BOTTOM DECORATION
        ================================================== -->

        <div class="garden-bottom">

            <div class="grass grass-1">🌱</div>
            <div class="flower flower-1">🌸</div>
            <div class="flower flower-2">🌼</div>
            <div class="grass grass-2">🌱</div>
            <div class="flower flower-3">🌷</div>
            <div class="grass grass-3">🌱</div>
            <div class="flower flower-4">🌻</div>
            <div class="grass grass-4">🌱</div>

        </div>


        <!-- =================================================
             MUSIC
        ================================================== -->

        <audio
            id="backgroundMusic"
            loop
            preload="auto"
        >
            <source
                src="assets/audio/menu.mp3"
                type="audio/mpeg"
            >
        </audio>

        <audio
            id="clickSound"
            preload="auto"
        >
            <source
                src="assets/audio/click.mp3"
                type="audio/mpeg"
            >
        </audio>


        <!-- =================================================
             SETTINGS MODAL
        ================================================== -->

        <div
            class="modal-overlay"
            id="settingsModal"
        >

            <div class="settings-modal">

                <button
                    class="modal-close"
                    id="closeSettings"
                >
                    ×
                </button>

                <div class="settings-icon">
                    ⚙️
                </div>

                <h2>
                    Pengaturan
                </h2>

                <p>
                    Atur suara permainan
                </p>

                <button
                    class="settings-option"
                    id="musicToggle"
                >

                    <span>
                        🎵 Musik
                    </span>

                    <strong id="musicStatus">
                        ON
                    </strong>

                </button>

                <button
                    class="settings-option"
                    id="effectToggle"
                >

                    <span>
                        🔔 Suara Efek
                    </span>

                    <strong id="effectStatus">
                        ON
                    </strong>

                </button>

            </div>

        </div>


        <!-- =================================================
             COMING SOON MODAL
        ================================================== -->

        <div
            class="modal-overlay"
            id="gameModal"
        >

            <div class="game-modal">

                <div class="modal-kiko">
                    <img
                        src="assets/character/kiko-thinking.png"
                        alt="Kiko"
                        id="modalKikoImage"
                    >
                </div>

                <h2 id="gameModalTitle">
                    Yuk Bermain!
                </h2>

                <p id="gameModalText">
                    Permainan sedang disiapkan.
                </p>

                <button
                    class="primary-button"
                    id="startGameButton"
                >
                    ▶ MULAI
                </button>

                <button
                    class="secondary-button"
                    id="closeGameModal"
                >
                    KEMBALI
                </button>

            </div>

        </div>

        <!-- =====================================================
     SPLASH SCREEN
====================================================== -->

<div
    class="splash-overlay"
    id="splashOverlay"
>

    <img
        src="assets/background/splash_screen.png"
        alt="Petualangan Huruf"
        class="splash-image"
        id="splashImage"
    >

</div>

    </main>


    <!-- JavaScript -->
        <script src="js/audio.js"></script>
    <script src="js/progress.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
